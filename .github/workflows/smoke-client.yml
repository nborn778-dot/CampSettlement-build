name: Smoke Test Client
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  smoke-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Launch Forge client under Xvfb
        shell: bash
        run: |
          set +e
          timeout 100s xvfb-run -a gradle runClient --no-daemon --stacktrace > client-smoke.log 2>&1
          code=$?
          cat client-smoke.log
          if [ "$code" -eq 124 ]; then
            echo "Client remained running until smoke-test timeout."
            exit 0
          fi
          exit "$code"
      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-smoke-log
          path: client-smoke.log
